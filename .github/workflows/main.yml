name: Build and Release YTMusicUltimate
on:
  workflow_dispatch:
    inputs: 
      ipa_url:
        description: "URL to the decrypted IPA file"
        default: ""
        required: true
        type: string

      display_name:
        description: "App Name (Optional)"
        default: "YouTube Music"
        required: true
        type: string

      vocal_removal:
        description: "Build the AI vocal removal edition (iOS 16+)"
        default: true
        required: true
        type: boolean

      bundle_id:
        description: "BundleID (Optional)"
        default: "com.google.ios.youtubemusic"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YTMusicUltimate
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@v6.0.2
        with:
          path: main
          submodules: recursive

      - name: Hide sensitive inputs
        uses: levibostian/action-hide-sensitive-inputs@v1
        with:
          exclude_inputs: bundle_id,display_name

      - name: Validate IPA URL
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          curl --fail --location --retry 3 -r 0-1023 --output sample.part "$IPA_URL" > /dev/null 2>&1
          
          file_type=$(file --mime-type -b sample.part)

          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::Validation failed: The file is not a valid IPA file. Detected type: $file_type."
            exit 1
          fi

      - name: Install Dependencies
        run: brew install make ldid

      - name: Set PATH environment variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Cache Theos
        id: theos
        uses: actions/cache@v5.0.3
        env:
          cache-name: theos_cache_344ee59
        with:
          path: theos/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Setup Theos
        if: steps.theos.outputs.cache-hit != 'true'
        uses: actions/checkout@v6.0.2
        with:
          repository: theos/theos
          ref: 344ee5925df036dbd1312b783ad5a00d153c2445
          path: theos
          submodules: recursive

      - name: Download iOS SDK
        if: steps.theos.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv *.sdk $THEOS/sdks

      - name: Install cyan
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Download YouTube Music
        env:
          IPA_URL: ${{ inputs.ipa_url }}
        run: |
          curl --fail --location --retry 3 --proto '=https' --proto-redir '=https' --silent --show-error --output ytm.ipa "$IPA_URL"
          unzip -tq ytm.ipa

      - name: Stage the verified Inst HQ 4 model
        if: inputs.vocal_removal
        run: |
          curl --fail --location --retry 3 --silent --show-error https://github.com/anton86511/EeveeSpotifyReincarnated/releases/download/v7.5.0-spotify-9.2.2-hq4-cpu-gpu/EeveeSpotify-9.2.2-HQ4-CPU-GPU.ipa --output hq4-reference.ipa
          python3 main/Source/VocalRemoval/bundle-hq4.py hq4-reference.ipa InstHQ4.mlmodelc

      - name: Build Tweak for Sideloading
        run: |
          cd main
          make clean package DEBUG=0 FINALPACKAGE=1 SIDELOADING=1 VOCAL_REMOVAL="${{ inputs.vocal_removal }}" TARGET=iphone:clang:latest:13.0
          mv packages/*.deb ../ytmult.deb

      - name: Inject tweak into provided IPA
        env:
          DISPLAY_NAME: ${{ inputs.display_name }}
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          args=(-u -w -s -n "$DISPLAY_NAME" -b "$BUNDLE_ID")
          if [[ "${{ inputs.vocal_removal }}" == true ]]; then
            mkdir -p Payload
            target=Payload/YouTubeMusic.app
            cyan -i ytm.ipa -o "$target" "${args[@]}" -m 16.0 -f ytmult.deb InstHQ4.mlmodelc
            binary="$target/$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$target/Info.plist")"
            ldid -e "$binary" > entitlements.plist
            python3 main/Source/VocalRemoval/bind-playback-audio.py "$binary"
            if [[ -s entitlements.plist ]]; then
              ldid -Sentitlements.plist "$binary"
            else
              ldid -S "$binary"
            fi
            zip -qry YTMusicUltimate-AI-Vocal-Removal.ipa Payload
            unzip -tq YTMusicUltimate-AI-Vocal-Removal.ipa
          else
            cyan -i ytm.ipa -o YTMusicUltimate.ipa "${args[@]}" -f ytmult.deb
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2.5.0
        with:
          name: YTMusicUltimate (${{ github.run_number }})
          tag_name: ytmu-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: YTMusicUltimate*.ipa
          fail_on_unmatched_files: true
          draft: true

      - name: Output Release URL
        run: |
          echo "::notice::Release available at: https://github.com/${{ github.repository }}/releases"
